name: xADAS-iOS
options:
  bundleIdPrefix: com.hmtnvac
  deploymentTarget:
    iOS: "16.0"
packages:
  VLCKit:
    url: https://github.com/videolan/vlckit.git
    branch: master
  ONNXRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    exactVersion: 1.20.0
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  xADAS-iOS:
    type: application
    platform: iOS
    sources:
      - path: xADAS-iOS
    dependencies:
      - package: VLCKit
        product: VLCKit
      - package: ONNXRuntime
        product: onnxruntime
    info:
      path: xADAS-iOS/Info.plist
      properties:
        CFBundleDisplayName: "Ivy"
        CFBundleName: "Ivy"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SeventyMaiToken: "__SEVENTYMAI_TOKEN__"
        MapboxAccessToken: "__MAPBOX_TOKEN__"
        NSCameraUsageDescription: "Ivy uses the camera for real-time driver-assistance vision processing."
        NSLocalNetworkUsageDescription: "Ivy connects directly to your 70mai dashcam on its local Wi-Fi network to receive the RTSP video stream."
        NSLocationWhenInUseUsageDescription: "Ivy uses GPS for vehicle speed and driver-assistance logic."
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Ivy
        PRODUCT_BUNDLE_IDENTIFIER: com.hmtnvac.xadas
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 100
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: xADAS-iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
