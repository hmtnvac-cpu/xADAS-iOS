name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xADAS-iOS/**"
      - "project.yml"
      - "scripts/download-model.sh"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Core ML model
        run: bash scripts/download-model.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project xADAS-iOS.xcodeproj \
            -scheme xADAS-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/xADAS-iOS.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry xADAS-iOS-V0.3-unsigned.ipa Payload
          shasum -a 256 xADAS-iOS-V0.3-unsigned.ipa > xADAS-iOS-V0.3-unsigned.sha256

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: xADAS-iOS-V0.3-unsigned
          path: |
            ${{ runner.temp }}/xADAS-iOS-V0.3-unsigned.ipa
            ${{ runner.temp }}/xADAS-iOS-V0.3-unsigned.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
