name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xADAS-iOS/**"
      - "project.yml"
      - "scripts/download-model.sh"
      - "scripts/download-lane-model.sh"
      - "scripts/download-vtsr-model.sh"
      - "scripts/download-vn82-model.sh"
      - "scripts/extract-ufldv2-model.py"
      - "scripts/quantize-ufldv2-model.py"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Core ML model
        run: bash scripts/download-model.sh

      - name: Cache UFLD V2 lane model
        uses: actions/cache@v4
        with:
          path: xADAS-iOS/Models/UFLDv2TuSimpleRes18Int8.onnx
          key: ufldv2-tusimple-res18-int8-2bac8d03

      - name: Prepare UFLD V2 lane model
        run: |
          python3 -m pip install --disable-pip-version-check onnx==1.17.0 onnxruntime==1.20.1
          bash scripts/download-lane-model.sh

      - name: Cache Vietnam traffic sign models
        uses: actions/cache@v4
        with:
          path: |
            xADAS-iOS/Models/VTSRInt8.onnx
            xADAS-iOS/Models/VTSRLabelMapping.json
            xADAS-iOS/Models/VNTrafficSign82.onnx
          key: vietnam-sign-models-v2-vn82

      - name: Prepare Vietnam traffic sign models
        run: |
          bash scripts/download-vtsr-model.sh
          bash scripts/download-vn82-model.sh

      - name: Verify VN82 ONNX contract
        run: |
          python3 - <<'PY'
          import onnx
          path = "xADAS-iOS/Models/VNTrafficSign82.onnx"
          model = onnx.load(path)
          graph = model.graph
          assert graph.input, "VN82 has no input"
          assert graph.output, "VN82 has no output"
          inp = graph.input[0]
          out = graph.output[0]
          in_shape = [d.dim_value if d.dim_value else d.dim_param for d in inp.type.tensor_type.shape.dim]
          out_shape = [d.dim_value if d.dim_value else d.dim_param for d in out.type.tensor_type.shape.dim]
          print("VN82 input:", inp.name, in_shape)
          print("VN82 output:", out.name, out_shape)
          assert inp.name == "images", f"unexpected VN82 input name: {inp.name}"
          assert out.name == "output0", f"unexpected VN82 output name: {out.name}"
          assert in_shape[-2:] == [640, 640], f"unexpected VN82 input shape: {in_shape}"
          assert 86 in out_shape, f"VN82 output does not expose 4+82=86 features: {out_shape}"
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Inject 70mai preview token
        env:
          SEVENTYMAI_TOKEN: ${{ secrets.SEVENTYMAI_TOKEN || secrets.A500S_TOKEN || secrets.TOKEN_70MAI || secrets['70MAI_TOKEN'] }}
        run: |
          set -euo pipefail
          if [ -n "${SEVENTYMAI_TOKEN:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SeventyMaiToken $SEVENTYMAI_TOKEN" xADAS-iOS/Info.plist
          else
            echo "70mai token secret is not configured; RTSP fallback remains available."
          fi

      - name: Inject Mapbox access token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN || secrets.MAPBOX_TOKEN || secrets.PUBLIC_MAPBOX_TOKEN || secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MAPBOX_TOKEN:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :MapboxAccessToken $MAPBOX_TOKEN" xADAS-iOS/Info.plist
            echo "Mapbox token injected."
          else
            echo "Mapbox token secret was not found under the supported names."
          fi

      - name: Verify deployment target before build
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild \
            -project xADAS-iOS.xcodeproj \
            -scheme xADAS-iOS \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -showBuildSettings)
          TARGET=$(printf '%s\n' "$SETTINGS" | awk '$1 == "IPHONEOS_DEPLOYMENT_TARGET" && $2 == "=" {print $3; exit}')
          echo "IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          test "$TARGET" = "16.0"

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild \
            -project xADAS-iOS.xcodeproj \
            -scheme xADAS-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Preflight built app bundle
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/xADAS-iOS.app"
          INFO="$APP_PATH/Info.plist"
          BIN="$APP_PATH/xADAS-iOS"
          test -d "$APP_PATH"
          test -f "$INFO"
          test -f "$BIN"
          test -d "$APP_PATH/YOLOv3TinyInt8LUT.mlmodelc"
          test -f "$APP_PATH/UFLDv2TuSimpleRes18Int8.onnx"
          test -f "$APP_PATH/VTSRInt8.onnx"
          test -f "$APP_PATH/VTSRLabelMapping.json"
          test -f "$APP_PATH/VNTrafficSign82.onnx"
          CAMERA_USAGE=$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$INFO")
          LOCAL_NETWORK_USAGE=$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$INFO")
          LOCATION_USAGE=$(/usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' "$INFO")
          MIN_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")
          echo "Camera usage: $CAMERA_USAGE"
          echo "Local network usage: $LOCAL_NETWORK_USAGE"
          echo "Location usage: $LOCATION_USAGE"
          echo "Minimum OS: $MIN_OS"
          test -n "$CAMERA_USAGE"
          test -n "$LOCAL_NETWORK_USAGE"
          test -n "$LOCATION_USAGE"
          test "$MIN_OS" = "16.0"
          xcrun vtool -show-build "$BIN"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/xADAS-iOS.app"
          INFO="$APP_PATH/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          NAME="xADAS-iOS-V${VERSION}-B${BUILD}-unsigned"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$NAME.ipa" Payload
          shasum -a 256 "$NAME.ipa" > "$NAME.sha256"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.IPA_NAME }}.ipa
            ${{ runner.temp }}/${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
