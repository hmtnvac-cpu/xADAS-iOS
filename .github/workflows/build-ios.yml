name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xADAS-iOS/**"
      - "IvyShareExtension/**"
      - "project.yml"
      - "scripts/download-model.sh"
      - "scripts/download-lane-model.sh"
      - "scripts/extract-ufldv2-model.py"
      - "scripts/quantize-ufldv2-model.py"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Download vehicle Core ML model
        run: bash scripts/download-model.sh
      - name: Cache UFLD V2 lane model
        uses: actions/cache@v4
        with:
          path: xADAS-iOS/Models/UFLDv2TuSimpleRes18Int8.onnx
          key: ufldv2-tusimple-res18-int8-2bac8d03
      - name: Prepare UFLD V2 lane model
        run: |
          python3 -m pip install --disable-pip-version-check onnx==1.17.0 onnxruntime==1.20.1
          bash scripts/download-lane-model.sh
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' IvyShareExtension/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule' IvyShareExtension/Info.plist
      - name: Inject runtime API keys
        env:
          SEVENTYMAI_TOKEN: ${{ secrets.SEVENTYMAI_TOKEN || secrets.A500S_TOKEN || secrets.TOKEN_70MAI || secrets['70MAI_TOKEN'] }}
          GRAPHHOPPER_API_KEY: ${{ secrets.GRAPHHOPPER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SEVENTYMAI_TOKEN:-}" ]; then
            /usr/libexec/PlistBuddy -c "Set :SeventyMaiToken $SEVENTYMAI_TOKEN" xADAS-iOS/Info.plist
          else
            echo "70mai token secret is not configured; RTSP fallback remains available."
          fi
          if [ -z "${GRAPHHOPPER_API_KEY:-}" ]; then
            echo "GRAPHHOPPER_API_KEY secret is required for Ivy navigation." >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :GraphHopperAPIKey $GRAPHHOPPER_API_KEY" xADAS-iOS/Info.plist
      - name: Verify navigation configuration
        run: |
          set -euo pipefail
          grep -R "graphhopper.com/api/1/route" xADAS-iOS/ADAS
          grep -R "openstreetmap.de\|openstreetmap.org" xADAS-iOS/ADAS xADAS-iOS/Views
          grep -q "NSMicrophoneUsageDescription" project.yml
          grep -q "NSSpeechRecognitionUsageDescription" project.yml
          ! grep -R "ios-navigation-sdk\|GoogleMapsAPIKey\|__GOOGLE_MAPS_API_KEY__" project.yml xADAS-iOS IvyShareExtension
      - name: Verify deployment target before build
        run: |
          set -euo pipefail
          SETTINGS=$(xcodebuild -project xADAS-iOS.xcodeproj -scheme xADAS-iOS -sdk iphoneos -destination 'generic/platform=iOS' -showBuildSettings)
          TARGET=$(printf '%s\n' "$SETTINGS" | awk '$1 == "IPHONEOS_DEPLOYMENT_TARGET" && $2 == "=" {print $3; exit}')
          test "$TARGET" = "16.0"
      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild -project xADAS-iOS.xcodeproj -scheme xADAS-iOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Ad-hoc sign nested extension and app
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Ivy.app"
          SHARE="$APP_PATH/PlugIns/IvyShareExtension.appex"
          codesign --force --sign - --timestamp=none "$SHARE"
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
      - name: Preflight built Ivy app bundle
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Ivy.app"
          INFO="$APP_PATH/Info.plist"
          BIN="$APP_PATH/Ivy"
          SHARE="$APP_PATH/PlugIns/IvyShareExtension.appex"
          SHARE_INFO="$SHARE/Info.plist"
          test -d "$APP_PATH" && test -f "$INFO" && test -f "$BIN"
          test -d "$APP_PATH/YOLOv3TinyInt8LUT.mlmodelc"
          test -f "$APP_PATH/UFLDv2TuSimpleRes18Int8.onnx"
          test -d "$SHARE" && test -f "$SHARE_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO")" = "16.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO")" = "Ivy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$INFO")" = "ivy"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :NSSpeechRecognitionUsageDescription' "$INFO" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$SHARE_INFO")" = "com.apple.share-services"
          RULE=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule' "$SHARE_INFO")
          test "$RULE" = "TRUEPREDICATE"
          KEY=$(/usr/libexec/PlistBuddy -c 'Print :GraphHopperAPIKey' "$INFO")
          test -n "$KEY" && test "$KEY" != "__GRAPHHOPPER_API_KEY__"
          codesign --verify --strict "$SHARE"
          xcrun vtool -show-build "$BIN"
      - name: Package Ivy IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Ivy.app"
          INFO="$APP_PATH/Info.plist"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO")
          NAME="Ivy-V${VERSION}-B${BUILD}-adhoc"
          rm -rf "$RUNNER_TEMP/Payload" && mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && /usr/bin/zip -qry "$NAME.ipa" Payload
          shasum -a 256 "$NAME.ipa" > "$NAME.sha256"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.IPA_NAME }}.ipa
            ${{ runner.temp }}/${{ env.IPA_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
